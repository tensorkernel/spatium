[package]
name = "disk-analyzer-napi"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.78"
authors = ["DiskAnalyzer Project"]
description = "Node native binding for the DiskAnalyzer Rust core engine (napi-rs)."
publish = false

[lib]
name = "disk_analyzer_napi"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2"
disk-analyzer-core = { path = "../core" }
parking_lot = { workspace = true }
once_cell = { workspace = true }

[build-dependencies]
napi-build = "2"

