# Cargo configuration per 02-SYSTEM-ARCHITECTURE.md §2.6 and 18-CI-CD-RELEASE-PIPELINE.md.
# Local cargo settings (e.g., Windows SDK target flags for the windows-rs crate).

[build]
# Default target for `cargo build` in this repo. The product is Windows-only at launch
# (per 00-MASTER-PROMPT.md §0.7), but Phase 1 (cross-platform MVP) builds on the host.
# Phase 2 will gate the windows-rs dependency behind a target-specific feature.

[net]
# Faster git fetches during dev; safe in CI too.
git-fetch-with-cli = true

[alias]
# Convenience: `cargo x` runs the workspace test suite
x = "test --workspace"
# `cargo cb` runs clippy with -D warnings per 18-CI-CD-RELEASE-PIPELINE.md §18.2
cb = "clippy --all-targets --all-features -- -D warnings"
